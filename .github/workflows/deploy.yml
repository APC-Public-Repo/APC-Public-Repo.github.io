name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Picks up Airtable edits without a code change. Airtable automations can
  # also POST a repository_dispatch with event_type "airtable" to rebuild now.
  repository_dispatch:
    types: [airtable]
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/configure-pages@v5
        id: pages
      - run: pnpm install --frozen-lockfile
      # Rewrites src/content/*.json from Airtable. A failure here leaves the
      # committed JSON in place, so the deploy still ships the last good copy.
      - run: node scripts/airtable-sync.mjs
        continue-on-error: true
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      - run: pnpm build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      # Pages serves 404.html for unknown paths; the SPA reads the URL itself.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
